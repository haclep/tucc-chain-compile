[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chaincompile"
version = "0.1.0"
description = "Compile-from-target chain selector for factorized-UCC chains (SD-routed Givens elimination) with numeric CC-translation diagnostics. Standalone validation prototype."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
fast = ["numba"]
dev = ["pytest>=7"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
